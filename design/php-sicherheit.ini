; Abhilfe für CVE-2026-109618 / CVE-2026-109619 (PHP-RCE, 21.10.2026), bis ein humhub/humhub:1.18-Image
; mit PHP >= 8.4.27 vorliegt. Lädt als zzz-… nach zz-uploads.ini und überschreibt dessen memory_limit.
; https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
; https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp

; 109618: Kein PHP-eigenes Speicherlimit mehr, damit Angreifer kein OOM gezielt auslösen können.
; Begrenzt wird stattdessen über mem_limit des Containers (compose.yml). ZURÜCKNEHMEN nach dem Update.
memory_limit = -1

; 109619: Upload-Fortschritt (von HumHub nicht genutzt) bleibt auch nach dem Update aus.
session.upload_progress.enabled = 0

; Weniger Angriffsfläche beim Zerlegen von Formularen (HumHub-Formulare sind nur wenige Ebenen tief).
max_input_nesting_level = 16
