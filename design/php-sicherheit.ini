; Härtung nach CVE-2026-109618 / CVE-2026-109619 (PHP-RCE, 21.10.2026, behoben ab PHP 8.4.27).
; Die vorläufige Abhilfe memory_limit = -1 ist seit dem Image mit PHP 8.4.27 wieder entfernt
; (es gilt memory_limit aus zz-uploads.ini). Diese Einstellungen bleiben als zusätzliche Absicherung.
; https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
; https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp

; 109619: Upload-Fortschritt (von HumHub nicht genutzt) bleibt aus – laut PHP-Team kaum getestet.
session.upload_progress.enabled = 0

; Weniger Angriffsfläche beim Zerlegen von Formularen (HumHub-Formulare sind nur wenige Ebenen tief).
max_input_nesting_level = 16
